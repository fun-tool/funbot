<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Mac：编译后把程序放进账号组文件夹</title>
<desc id="desc">操作示意：在源码目录执行 CGO_ENABLED=0 go build .，拖动生成的程序到账号组A，再进入账号组文件夹导入并启动。</desc>
<rect width="1200" height="680" rx="24" fill="#f2f7f4"/>
<text x="40" y="44" fill="#467560" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700">FUNBOT  /  操作示意</text>
<text x="40" y="91" fill="#153d30" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="700">Mac：先编译，再把程序拖进账号组</text>
<text x="40" y="125" fill="#153d30" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="500">源码文件夹用于编译；账号组文件夹用于导入、启动和保存钱包。</text>
<rect x="40" y="158" width="476" height="280" rx="14" fill="#fff" stroke="#cfdfd6"/>
<text x="63" y="195" fill="#153d30" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700">① funbot 源码文件夹</text>
<text x="64" y="232" fill="#607367" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="500">go.mod    main.go    public</text>
<rect x="62" y="251" width="432" height="52" rx="14" fill="#102e24" stroke="#102e24"/>
<text x="79" y="285" fill="#94f0bf" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="600">CGO_ENABLED=0 go build .</text>
<rect x="62" y="320" width="432" height="94" rx="14" fill="#e5f3ec" stroke="#72ab8c"/>
<path d="M80 339 h28 l10 10 v44 h-38 z" fill="#155b40"/>
<text x="136" y="357" fill="#153d30" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="700">funbot</text>
<text x="136" y="391" fill="#153d30" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500">无后缀的文件；类型：Unix 可执行文件</text>
<path d="M548 293 H633 l-14 -12 m14 12 l-14 12" fill="none" stroke="#197a50" stroke-width="4"/>
<text x="550" y="260" fill="#153d30" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700">鼠标拖入</text>
<rect x="665" y="158" width="495" height="280" rx="14" fill="#fff" stroke="#cfdfd6"/>
<text x="688" y="195" fill="#153d30" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700">② 桌面新建「账号组A」</text>
<path d="M690 218 h49 l12 12 h340 v170 h-401 z" fill="#f5e6b8" stroke="#d6bc70" stroke-width="2"/>
<rect x="709" y="253" width="361" height="105" rx="14" fill="#fff" stroke="#d6bc70"/>
<text x="733" y="293" fill="#153d30" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="700">funbot</text>
<text x="733" y="329" fill="#153d30" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="500">只放编译好的这个文件</text>
<text x="688" y="424" fill="#153d30" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500">不用搬 main.go、go.mod 或 public。</text>
<rect x="40" y="459" width="1120" height="177" rx="14" fill="#102e24" stroke="#102e24"/>
<text x="65" y="496" fill="#fff" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700">③ 进入「账号组A」后，再执行</text>
<text x="65" y="535" fill="#94f0bf" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="600">./funbot -add master</text>
<text x="815" y="535" fill="#d5e8df" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20">导入主号</text>
<text x="65" y="572" fill="#94f0bf" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="600">./funbot</text>
<text x="815" y="572" fill="#d5e8df" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20">启动程序</text>
<text x="65" y="611" fill="#d5e8df" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="500">多组账号管理：复制程序到各自文件夹；新账号组不要复制别人的 .data。</text>
</svg>