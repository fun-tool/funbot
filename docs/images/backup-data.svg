<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
<title id="title">备份、更新与搬家：记住程序旁的 .data</title><desc id="desc">先停止任务，检查待确认交易，再用 Ctrl + C 退出程序。。操作示意，不含真实钱包信息。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#237b59"/></marker></defs>
<rect x="0" y="0" width="1200" height="870" rx="24" fill="#f3f7f4"/>
<text x="40" y="40" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#3a7359">FUNBOT  /  看图操作</text>
<text x="40" y="91" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="36" font-weight="750" fill="#183f31">备份、更新与搬家：记住程序旁的 .data</text>
<text x="40" y="130" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="500" fill="#476257">先停止任务，检查待确认交易，再用 Ctrl + C 退出程序。</text>
<text x="40" y="846" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" fill="#60796c">操作示意 · 以实际页面提示为准 · 助记词和私钥只在本机终端输入</text>
<path d="M40 197 V182 H105 L120 197 H465 V672 H40Z" fill="#f8e8b4" stroke="#d7bd71" stroke-width="2"/>
<text x="60" y="237" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#183f31">账号组A</text>
<rect x="65" y="285" width="374" height="100" rx="14" fill="#fff"/>
<text x="90" y="329" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#183f31">funbot</text>
<text x="90" y="365" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="500" fill="#183f31">程序可以重新编译</text>
<rect x="65" y="415" width="374" height="180" rx="14" fill="#dceddf" stroke="#237b59"/>
<text x="90" y="461" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="700" fill="#183f31">.data</text>
<text x="90" y="505" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="500" fill="#183f31">加密钱包、合约地址和设置</text>
<text x="90" y="547" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="500" fill="#183f31">备份时完整保留这个目录</text>
<rect x="505" y="165" width="655" height="150" rx="14" fill="#fff" stroke="#cbded1"/>
<rect x="527" y="185" width="38" height="38" rx="19" fill="#145d41"/>
<text x="546" y="212" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#fff">1</text>
<text x="579" y="213" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#183f31">备份钱包</text>
<text x="531" y="265" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="500" fill="#183f31">退出后备份整个 .data，记住原密钥密码。</text>
<rect x="505" y="336" width="655" height="150" rx="14" fill="#fff" stroke="#cbded1"/>
<rect x="527" y="356" width="38" height="38" rx="19" fill="#145d41"/>
<text x="546" y="383" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#fff">2</text>
<text x="579" y="384" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#183f31">更新程序</text>
<text x="531" y="436" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="500" fill="#183f31">重新编译 → 替换 funbot → 保留原 .data。</text>
<rect x="505" y="507" width="655" height="150" rx="14" fill="#fff" stroke="#cbded1"/>
<rect x="527" y="527" width="38" height="38" rx="19" fill="#145d41"/>
<text x="546" y="554" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#fff">3</text>
<text x="579" y="555" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#183f31">移动到新位置</text>
<text x="531" y="607" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="500" fill="#183f31">移动整个账号组文件夹，程序与 .data 一起带走。</text>
<rect x="40" y="711" width="1120" height="92" rx="14" fill="#102d23"/>
<text x="65" y="748" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#fff">找不到隐藏目录？</text>
<text x="65" y="781" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="500" fill="#bdebd0">Windows：文件夹地址栏追加 \.data    Mac：Command + Shift + .</text>
</svg>